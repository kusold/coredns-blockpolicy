name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet + Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.24.x"
          - "1.25.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  race:
    name: Race (Go 1.25.x)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Race test
        run: go test -race -count=1 ./...

  required:
    name: CI / Race, Vet, Test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - test
      - race
    steps:
      - name: Verify matrix jobs succeeded
        run: |
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.race.result }}" = "success" ] || exit 1
