name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      bench_time:
        description: "Per-benchmark run time (for example: 1s, 3s)"
        required: false
        default: "1s"
      bench_count:
        description: "How many times to run each benchmark"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run benchmark suite
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime="${{ github.event.inputs.bench_time }}" -count="${{ github.event.inputs.bench_count }}" ./blockpolicy | tee bench.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt
