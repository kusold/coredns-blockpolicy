name: Fuzz Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz smoke (Go 1.25.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Fuzz parse smoke
        run: go test ./blockpolicy -run=^$ -fuzz=FuzzParseEntriesWithBlocky -fuzztime=5s

      - name: Fuzz engine smoke
        run: go test ./blockpolicy -run=^$ -fuzz=FuzzEngineEvaluate -fuzztime=5s
