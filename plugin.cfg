# blockpolicy should run after metadata and cache, but before forward/proxy.
# Insert this line into CoreDNS's plugin.cfg between "cache" and "rewrite":
#
#   blockpolicy:github.com/kusold/coredns-blockpolicy/blockpolicy
#
# Example ordering context:
#   metadata:metadata
#   cancel:cancel
#   tls:tls
#   reload:reload
#   ...
#   cache:cache
#   blockpolicy:github.com/kusold/coredns-blockpolicy/blockpolicy
#   rewrite:rewrite
#   ...
#   forward:forward
blockpolicy:github.com/kusold/coredns-blockpolicy/blockpolicy
